name: CI

# Laeuft bei jedem Push auf main und bei jedem Pull Request.
# Der PR-Trigger ist der wichtige: Er blockiert spaeter den Merge, wenn etwas rot ist.
on:
  push:
    branches: [main]
  pull_request:

# Ein laufender Durchlauf wird abgebrochen, wenn neue Commits nachkommen.
# Spart Laufzeit und Wartezeit bei schneller Aufeinanderfolge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Ein echter PostgreSQL-Container fuer die Dauer des Jobs.
    # Kein Mock: Die E2E-Tests sollen gegen dieselbe Datenbankversion laufen
    # wie lokal und spaeter in Produktion.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: devboard
          POSTGRES_PASSWORD: devboard
          POSTGRES_DB: devboard_test
        ports:
          - 5432:5432
        # Ohne Healthcheck starten die Tests, bevor Postgres Verbindungen annimmt.
        options: >-
          --health-cmd "pg_isready -U devboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://devboard:devboard@localhost:5432/devboard_test?schema=public
      # Wegwerf-Geheimnis nur fuer den Testlauf. Es signiert ausschliesslich
      # Token, die innerhalb dieses Jobs erzeugt und wieder verworfen werden -
      # deshalb darf es hier im Klartext stehen und muss KEIN GitHub-Secret
      # sein. Ein echtes Produktionsgeheimnis in einer Workflow-Datei waere
      # dagegen ein schwerer Fehler: Die Datei ist im Repository sichtbar.
      JWT_SECRET: nur-fuer-die-ci-ein-wegwerf-geheimnis-mit-32-zeichen
      JWT_ACCESS_TTL: 15m
      # Ebenfalls ein Wegwerf-Wert, aus demselben Grund wie oben. Genau 64
      # Hex-Zeichen, weil AES-256 einen Schluessel von genau 32 Byte verlangt.
      #
      # Dass diese Zeile hier fehlte, hat den ersten CI-Lauf von Scheibe 5.2
      # rot gemacht - und zwar richtig: Die Fail-Fast-Pruefung im Env-Schema
      # hat den Start verweigert, statt spaeter beim Verschluesseln
      # umzufallen. Der Fehlschlag stand an der Stelle, an der er hingehoert.
      WEBHOOK_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      # Ohne Vorgabe wuerde hier localhost:3000 stehen; der Wert wird in den
      # Tests nur als Praefix der angezeigten Webhook-URL geprueft.
      PUBLIC_BASE_URL: http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` statt `npm install`: installiert exakt die Versionen aus dem
      # Lockfile und schlaegt fehl, wenn package.json und Lockfile auseinanderlaufen.
      # Reproduzierbar - genau das, was eine Pipeline braucht.
      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Prisma-Client erzeugen
        run: npx prisma generate

      # `migrate deploy` statt `migrate dev`: wendet nur vorhandene Migrationen an
      # und erzeugt oder verwirft nichts. Das Einzige, was ausserhalb der lokalen
      # Entwicklung laufen darf.
      - name: Migrationen anwenden
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint:ci

      - name: Unit-Tests
        run: npm test

      - name: E2E-Tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # ===========================================================================
  # AUSROLLEN
  # ===========================================================================
  # Bewusst ein Job in DIESEM Workflow und kein eigener:
  #
  # `needs` garantiert, dass Backend und Frontend gruen waren. Ein separater
  # Workflow muesste ueber `workflow_run` an die CI gekoppelt werden - das ist
  # umstaendlicher und kann im Fehlerfall einen ungetesteten Stand ausrollen.
  # Die Abhaengigkeit soll hart sein, nicht abgeleitet.
  deploy:
    name: Deploy
    needs: [backend, frontend]
    # Nur bei einem Push auf main. Pull Requests bauen und testen, rollen aber
    # nichts aus - auch nicht aus einem Fork, wo jemand eine eigene
    # Workflow-Datei mitliefern koennte.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Eigene Sperre OHNE `cancel-in-progress`. Der Workflow oben bricht
    # laufende Durchlaeufe ab, sobald neue Commits kommen - fuer Tests richtig,
    # fuer ein Deployment gefaehrlich: Ein mitten im Umschalten abgebrochener
    # Lauf hinterlaesst einen halben Zustand. Deployments warten also
    # aufeinander, statt sich gegenseitig abzuschiessen.
    concurrency:
      group: deploy-produktion
      cancel-in-progress: false

    permissions:
      contents: read
      # Zum Schieben in die GitHub-Registry. Ohne diese Zeile darf der
      # mitgelieferte GITHUB_TOKEN nur lesen.
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 1. Image bauen und in die Registry schieben
      # ---------------------------------------------------------------------
      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Kein eigenes Geheimnis noetig: GitHub stellt jedem Lauf ein Token
          # aus, das nur fuer dieses Repository gilt und mit dem Lauf ablaeuft.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Zwei Tags: Die Commit-Kennung ist die Wahrheit, `latest` nur die
          # Bequemlichkeit fuer Aufrufe von Hand.
          tags: |
            ghcr.io/${{ github.repository_owner }}/devboard-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/devboard-backend:latest
          # Ohne Cache baut jeder Lauf die Abhaengigkeiten neu.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Ausdruecklich x86, passend zum Server. Ein Image ist an die
          # Architektur gebunden; ein ARM-Server braeuchte einen zweiten Bau.
          platforms: linux/amd64

      # ---------------------------------------------------------------------
      # 2. Migrationen - VOR dem Umschalten
      # ---------------------------------------------------------------------
      # Die Reihenfolge ist der Kern von ADR-016: Migration und neuer Code
      # werden zu verschiedenen Zeitpunkten wirksam. Zuerst die Datenbank, dann
      # der Code - dann laeuft fuer einen Moment die ALTE Anwendung gegen das
      # NEUE Schema, und das ist der harmlose der beiden Zustaende. Andersherum
      # waere die Anwendung zwischen beiden Schritten kaputt.
      #
      # Daraus folgt die Pflicht, die ab jetzt fuer jede Migration gilt: Sie
      # muss abwaertskompatibel sein. Spalte hinzufuegen ja, Spalte umbenennen
      # nur in zwei Schritten.
      #
      # Das geht nur, weil die Datenbank bei Neon liegt und vom Runner aus
      # erreichbar ist. Laege sie hinter der Firewall des Servers, braeuchte es
      # ein eigenes Migrations-Image.
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Migrationswerkzeug installieren
        working-directory: backend
        run: npm ci

      - name: Migrationen gegen die Produktionsdatenbank anwenden
        working-directory: backend
        env:
          # Die DIREKTE Adresse, nicht die gepoolte: Migrationen halten Sperren
          # ueber mehrere Anweisungen hinweg und brauchen eine durchgehende
          # Sitzung. Ein Pooler darf zwischendurch eine andere Verbindung
          # unterschieben - dann sind die Sperren weg.
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: npx prisma migrate deploy

      # ---------------------------------------------------------------------
      # 3. Auf dem Server umschalten
      # ---------------------------------------------------------------------
      - name: SSH vorbereiten
        env:
          SCHLUESSEL: ${{ secrets.DEPLOY_SSH_KEY }}
          BEKANNTE_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SCHLUESSEL" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Der Fingerabdruck des Servers kommt aus einem Geheimnis, NICHT aus
          # `ssh-keyscan`. Wer den Schluessel in dem Moment abfragt, in dem er
          # ihm vertrauen soll, prueft nichts - er glaubt dem, der gerade
          # antwortet.
          printf '%s\n' "$BEKANNTE_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Neue Fassung ausrollen
        env:
          ZIEL: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$ZIEL" \
            "set -euo pipefail; \
             cd devboard; \
             git fetch --quiet origin main; \
             git reset --hard --quiet origin/main; \
             export DEVBOARD_TAG=$TAG; \
             docker compose -f docker-compose.produktion.yml pull backend; \
             docker compose -f docker-compose.produktion.yml up -d backend; \
             docker image prune --force --filter 'until=168h'"

      # ---------------------------------------------------------------------
      # 4. Nachweis
      # ---------------------------------------------------------------------
      # Ein Deployment, das nur "erfolgreich" meldet, weil kein Befehl
      # fehlgeschlagen ist, sagt nichts ueber die laufende Anwendung. Deshalb
      # wird von AUSSEN geprueft - ueber dieselbe Adresse wie ein Besucher,
      # samt Reverse Proxy und TLS.
      - name: Warten, bis die neue Fassung gesund antwortet
        env:
          BASIS: ${{ secrets.DEPLOY_BASE_URL }}
        run: |
          for versuch in $(seq 1 20); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 10 "$BASIS/health" || echo 000)
            if [ "$code" = "200" ] && grep -q '"database":"up"' /tmp/health.json; then
              echo "Gesund nach Versuch $versuch:"
              cat /tmp/health.json
              exit 0
            fi
            echo "Versuch $versuch: HTTP $code"
            sleep 5
          done
          echo "Die neue Fassung ist nicht gesund geworden."
          exit 1
