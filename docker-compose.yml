# DevBoard - lokale Entwicklungsumgebung
#
# Starten:  docker compose up -d
# Stoppen:  docker compose down
# Logs:     docker compose logs -f db

services:
  db:
    image: postgres:18-alpine
    container_name: devboard-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    # Ab Postgres 18 sitzt der Mount auf /var/lib/postgresql (nicht .../data).
    # Das Image legt die Daten darunter versionsbenannt ab: /var/lib/postgresql/18/docker
    volumes:
      - devboard-db-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  devboard-db-data:
