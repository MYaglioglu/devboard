# =============================================================================
# DevBoard - Produktion
# =============================================================================
#
# Nur noch das Backend. Der Reverse Proxy ist seit Scheibe 6.3 ein eigener
# Stapel (docker-compose.proxy.yml) - Begruendung steht dort.
#
# Was hier NICHT drinsteht: die Datenbank. Sie liegt bei Neon (ADR-016).
#
# Starten (Proxy muss laufen, er definiert das Netz):
#   docker compose -f docker-compose.produktion.yml up -d --build
#
# Logs:
#   docker compose -f docker-compose.produktion.yml logs -f
# =============================================================================

name: devboard-produktion

services:
  backend:
    # In dieser Scheibe wird auf dem Server gebaut. Scheibe 6.4 ersetzt das
    # durch `image: ghcr.io/...` - dann baut GitHub Actions, und der Server
    # zieht nur noch das geprueft gebaute Image.
    build:
      context: ./backend
    image: devboard-backend:aktuell

    # `unless-stopped` statt `always`: Nach einem Serverneustart faehrt der
    # Container wieder hoch - aber wenn ich ihn absichtlich gestoppt habe,
    # bleibt er gestoppt. `always` wuerde ihn auch dann starten und mir bei
    # der Fehlersuche in den Ruecken fallen.
    restart: unless-stopped

    env_file: .env.produktion

    # `expose` und NICHT `ports`:
    #
    #   ports:  "3000:3000"  -> Port am SERVER offen, aus dem Internet
    #                           erreichbar. Die Sicherheit haengt dann an einer
    #                           Firewallregel ausserhalb dieser Datei.
    #   expose: "3000"       -> nur im Docker-Netz sichtbar.
    #
    # Damit gibt es genau EINEN Weg von aussen: durch Caddy. Nicht weil eine
    # Regel es verbietet, sondern weil es keinen zweiten Weg gibt.
    #
    # Ab dieser Scheibe kommt ein zweiter Grund dazu: Mit `ports` koennte
    # Staging gar nicht danebenlaufen - der Port waere belegt.
    expose:
      - "3000"

    networks:
      - web

    # Kein healthcheck-Block: Der steht im Image (backend/Dockerfile) und gilt
    # automatisch. Ihn hier zu wiederholen waere eine zweite Wahrheit.

networks:
  # `external: true` heisst: Dieses Netz wird hier ERWARTET, nicht angelegt.
  # Es entsteht im Proxy-Stapel. Laeuft der nicht, verweigert Compose hier den
  # Start mit einer klaren Meldung - besser als ein Backend, das lauft und
  # das niemand erreichen kann.
  web:
    name: devboard-web
    external: true
