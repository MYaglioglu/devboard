# =============================================================================
# DevBoard - Produktion (Hetzner)
# =============================================================================
#
# Diese Datei beschreibt, was auf dem Server laeuft. Sie gehoert bewusst INS
# REPOSITORY: Ein Server, dessen Zustand nur in der Erinnerung des Betreibers
# existiert, ist nicht wiederherstellbar. Wer diese Datei hat, kann die
# Umgebung nachbauen.
#
# Was hier NICHT drinsteht: die Datenbank. Sie liegt bei Neon (ADR-016).
# Deshalb gibt es hier keinen Postgres-Dienst und kein Datenvolumen fuer ihn.
#
# Starten (auf dem Server, im Repository-Verzeichnis):
#   docker compose -f docker-compose.produktion.yml up -d --build
#
# Logs:
#   docker compose -f docker-compose.produktion.yml logs -f
# =============================================================================

name: devboard-prod

services:
  # ---------------------------------------------------------------------------
  # Das Backend. Von aussen NICHT erreichbar.
  # ---------------------------------------------------------------------------
  backend:
    # Seit Scheibe 6.4 wird hier NICHT mehr gebaut. GitHub Actions baut das
    # Image, schiebt es in die Registry, der Server zieht nur noch.
    #
    # WARUM DAS BESSER IST ALS `build:` AUF DEM SERVER
    #
    # Vorher baute der Server selbst. Das lief, hatte aber drei Nachteile: Er
    # braucht Bauwerkzeug, Speicher und Zeit - und vor allem baut er ein Image,
    # das so noch nie geprueft wurde. Die CI testet den Quelltext, der Server
    # baute daraus etwas Eigenes. Jetzt ist das Artefakt, das getestet wurde,
    # dasselbe, das laeuft.
    #
    # DER TAG IST DIE COMMIT-KENNUNG, NICHT `latest`.
    # `latest` ist ein beweglicher Zeiger: Man weiss hinterher nicht, was
    # laeuft, und ein Ruecksprung auf die vorige Fassung ist unmoeglich. Mit
    # der Kennung ist beides eindeutig - und Scheibe 6.5 kann darauf einen
    # Rollback bauen.
    #
    # Der Rueckfall auf `latest` greift nur, wenn jemand von Hand startet, ohne
    # eine Kennung zu setzen.
    image: ghcr.io/myaglioglu/devboard-backend:${DEVBOARD_TAG:-latest}

    # `unless-stopped` statt `always`: Nach einem Neustart des Servers faehrt
    # der Container wieder hoch - aber wenn ich ihn absichtlich gestoppt habe,
    # bleibt er gestoppt. `always` wuerde ihn auch dann wieder starten und mir
    # bei der Fehlersuche in den Ruecken fallen.
    restart: unless-stopped

    env_file: .env.produktion

    # `expose` und NICHT `ports`. Das ist der wichtigste Unterschied in dieser
    # Datei:
    #
    #   ports:  "3000:3000"  -> Port ist am SERVER offen, aus dem Internet
    #                           erreichbar. Die Hetzner-Firewall haelt ihn zwar
    #                           zu, aber dann haengt die Sicherheit an einer
    #                           Einstellung ausserhalb dieser Datei.
    #   expose: "3000"       -> Port ist nur im Docker-Netz sichtbar. Erreichbar
    #                           ausschliesslich fuer andere Container.
    #
    # Damit gibt es genau EINEN Weg von aussen zum Backend: durch Caddy. Nicht
    # weil eine Regel es verbietet, sondern weil es keinen zweiten Weg gibt.
    expose:
      - "3000"

    networks:
      - intern

    # Kein healthcheck-Block: Der steht im Image (siehe backend/Dockerfile) und
    # gilt automatisch. Ihn hier zu wiederholen waere eine zweite Wahrheit.

  # ---------------------------------------------------------------------------
  # Der Reverse Proxy. Der einzige Dienst mit Kontakt zum Internet.
  # ---------------------------------------------------------------------------
  caddy:
    # Version festgenagelt auf die Hauptversion. `caddy:latest` koennte ueber
    # Nacht eine neue Hauptversion werden und die Konfiguration brechen.
    image: caddy:2-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 laeuft ueber UDP. Ohne diese Zeile faellt Caddy still auf
      # HTTP/2 zurueck - kein Fehler, aber auch kein HTTP/3.
      - "443:443/udp"

    volumes:
      # :ro - der Proxy darf seine eigene Konfiguration nicht veraendern.
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

      # DAS WICHTIGSTE VOLUMEN AUF DEM SERVER.
      #
      # Hier liegen die TLS-Zertifikate und die privaten Schluessel dazu. Geht
      # es verloren, muss Caddy alle Zertifikate neu anfordern - und Let's
      # Encrypt hat eine Mengenbegrenzung (5 gleiche Zertifikate pro Woche).
      # Wer beim Herumprobieren mehrfach `docker compose down -v` aufruft,
      # sperrt sich fuer Tage aus.
      - caddy-data:/data

      - caddy-config:/config

    # Caddy liest {$API_DOMAIN} und {$ACME_EMAIL} zur Laufzeit aus der
    # Umgebung. Bewusst ueber env_file und NICHT ueber ${...} in dieser Datei:
    # Compose wuerde ${...} aus einer Datei namens `.env` ersetzen, nicht aus
    # `.env.produktion`. Es gaebe also zwei Quellen fuer Konfiguration. So
    # gibt es eine.
    env_file: .env.produktion

    # Erst starten, wenn das Backend GESUND ist - nicht nur gestartet.
    # `service_started` wuerde reichen, dass der Prozess laeuft; dann nimmt
    # Caddy Anfragen an, waehrend NestJS noch seinen Modulgraphen aufbaut, und
    # die ersten Aufrufe laufen in einen Fehler.
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - intern

volumes:
  caddy-data:
  caddy-config:

networks:
  # Ein eigenes Netz statt des Standardnetzes: Nur wer hier drin ist, kann das
  # Backend erreichen. Container anderer Compose-Projekte auf demselben Server
  # koennen es nicht - das wird relevant, sobald in 6.3 Staging danebensteht.
  intern:
